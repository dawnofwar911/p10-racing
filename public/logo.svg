  <g transform="translate(20, 20) scale(0.8)">
    <rect width="200" height="200" rx="40" fill="#15151e"/>
    <text x="100" y="108" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="68" fill="#ffffff" text-anchor="middle">P10</text>
    <text x="100" y="148" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" fill="#e10600" text-anchor="middle" letter-spacing="5">RACING</text>
    <rect x="45" y="162" width="110" height="6" rx="3" fill="#e10600"/>
  </g>
</svg>
